<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="805" viewBox="0 0 1600 805" role="img" aria-labelledby="title desc">
  <title id="title">Just Speak It low-level component diagram</title>
  <desc id="desc">The Expo mobile app connects through Supabase authentication and an API gateway to a Hono Edge Function. The Edge Function calls OpenAI and persists data through Supabase PostgREST. Mobile read models access PostgreSQL directly through PostgREST and row-level security. Audio persistence is optional and local to the device.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #344054; }
      .boundary-title { font-size: 20px; font-weight: 700; letter-spacing: .08em; }
      .node-title { font-size: 23px; font-weight: 700; }
      .node-sub { font-size: 17px; fill: #344054; }
      .route-title { font-size: 20px; font-weight: 700; }
      .route-sub { font-size: 17px; fill: #344054; }
      .edge-label { font-size: 16px; font-weight: 700; }
      .box { stroke-width: 2; }
      .edge { fill: none; stroke-width: 2.5; }
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6b8afd"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#32a47b"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#e2a24a"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#667085"/></marker>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <g transform="translate(0,-95)">

  <rect x="40" y="120" width="310" height="740" rx="18" fill="#f7f9fc" stroke="#b8c5d6" stroke-width="1.5"/>
  <text x="62" y="151" class="boundary-title" fill="#475467">CLIENT / DEVICE</text>

  <rect class="box" x="70" y="190" width="250" height="78" rx="12" fill="#eef2ff" stroke="#6b8afd"/>
  <text x="195" y="220" text-anchor="middle" class="node-title">Expo Mobile App</text>
  <text x="195" y="240" text-anchor="middle" class="node-sub">Capture · Cards</text>
  <text x="195" y="259" text-anchor="middle" class="node-sub">Diary · Review</text>

  <rect class="box" x="70" y="335" width="250" height="84" rx="12" fill="#ffffff" stroke="#a8b7d6"/>
  <text x="195" y="364" text-anchor="middle" class="node-title">API client</text>
  <text x="195" y="386" text-anchor="middle" class="node-sub">shared/api/client.ts</text>
  <text x="195" y="405" text-anchor="middle" class="node-sub">write commands</text>

  <rect class="box" x="70" y="475" width="250" height="84" rx="12" fill="#ffffff" stroke="#a8b7d6"/>
  <text x="195" y="504" text-anchor="middle" class="node-title">Read models</text>
  <text x="195" y="526" text-anchor="middle" class="node-sub">TanStack Query</text>
  <text x="195" y="547" text-anchor="middle" class="node-sub">PostgREST · refetch</text>

  <rect class="box" x="70" y="630" width="250" height="125" rx="12" fill="#ecfdf9" stroke="#4db6ac"/>
  <text x="195" y="658" text-anchor="middle" class="node-title">Optional local</text>
  <text x="195" y="683" text-anchor="middle" class="node-title">audio copy</text>
  <text x="195" y="712" text-anchor="middle" class="node-sub">Documents/recordings</text>
  <text x="195" y="736" text-anchor="middle" class="node-sub">MMKV index</text>

  <rect x="390" y="120" width="760" height="740" rx="18" fill="#f4fbf8" stroke="#8dc7b5" stroke-width="1.5"/>
  <text x="412" y="151" class="boundary-title" fill="#28735e">SUPABASE</text>

  <rect class="box" x="430" y="180" width="680" height="82" rx="12" fill="#e7f8f1" stroke="#32a47b"/>
  <text x="770" y="211" text-anchor="middle" class="node-title">Supabase Auth + Edge Functions Gateway</text>
  <text x="770" y="238" text-anchor="middle" class="node-sub">anonymous session · apikey · Bearer JWT · verify_jwt = true</text>

  <rect x="430" y="315" width="680" height="330" rx="14" fill="#f7f5ff" stroke="#8b7cf6" stroke-width="1.5"/>
  <text x="452" y="344" class="boundary-title" fill="#5946c7">EDGE FUNCTION: api (Deno + Hono)</text>
  <rect class="box" x="455" y="370" width="630" height="60" rx="10" fill="#ffffff" stroke="#b4a9fa"/>
  <text x="770" y="394" text-anchor="middle" class="node-title">Middleware / cross-cutting</text>
  <text x="770" y="416" text-anchor="middle" class="node-sub">verified JWT sub → userId · service-role client · profile · errors</text>

  <rect class="box" x="455" y="455" width="195" height="100" rx="10" fill="#eeeafe" stroke="#8b7cf6"/>
  <text x="552" y="480" text-anchor="middle" class="route-sub">POST</text>
  <text x="552" y="505" text-anchor="middle" class="route-title">/transcriptions</text>
  <text x="552" y="535" text-anchor="middle" class="route-sub">audio → STT → clean</text>

  <rect class="box" x="673" y="455" width="195" height="100" rx="10" fill="#eeeafe" stroke="#8b7cf6"/>
  <text x="770" y="480" text-anchor="middle" class="route-sub">POST</text>
  <text x="770" y="505" text-anchor="middle" class="route-title">/generations</text>
  <text x="770" y="535" text-anchor="middle" class="route-sub">split → translate</text>

  <rect class="box" x="890" y="455" width="195" height="100" rx="10" fill="#eeeafe" stroke="#8b7cf6"/>
  <text x="987" y="485" text-anchor="middle" class="route-title">State changes</text>
  <text x="987" y="515" text-anchor="middle" class="route-sub">translate · discard</text>
  <text x="987" y="539" text-anchor="middle" class="route-sub">review · undo</text>

  <rect class="box" x="455" y="570" width="630" height="58" rx="10" fill="#ffffff" stroke="#c5bdfb"/>
  <text x="770" y="606" text-anchor="middle" class="node-sub">Zod contracts · SRS rules · prompt/schema versions</text>

  <rect class="box" x="430" y="704" width="275" height="90" rx="12" fill="#e7f8f1" stroke="#32a47b"/>
  <text x="567" y="734" text-anchor="middle" class="node-title">PostgREST</text>
  <text x="567" y="760" text-anchor="middle" class="node-title">Read API</text>
  <text x="567" y="785" text-anchor="middle" class="node-sub">authenticated + RLS</text>

  <rect class="box" x="770" y="694" width="340" height="110" rx="12" fill="#e7f8f1" stroke="#32a47b"/>
  <text x="940" y="728" text-anchor="middle" class="node-title">PostgreSQL</text>
  <text x="940" y="754" text-anchor="middle" class="node-sub">profiles · entries · generations · cards</text>
  <text x="940" y="777" text-anchor="middle" class="node-sub">review_events · usage_events</text>

  <rect x="1200" y="120" width="330" height="520" rx="18" fill="#fff9ef" stroke="#e2a24a" stroke-width="1.5"/>
  <text x="1222" y="151" class="boundary-title" fill="#9a5d00">OPENAI</text>
  <rect class="box" x="1235" y="190" width="260" height="125" rx="12" fill="#fff3db" stroke="#e2a24a"/>
  <text x="1365" y="221" text-anchor="middle" class="node-title">Audio Transcriptions</text>
  <text x="1365" y="247" text-anchor="middle" class="node-title">API</text>
  <text x="1365" y="278" text-anchor="middle" class="node-sub">Japanese audio → rawText</text>
  <text x="1365" y="301" text-anchor="middle" class="node-sub">+ word timestamps</text>
  <rect class="box" x="1235" y="350" width="260" height="105" rx="12" fill="#fff3db" stroke="#e2a24a"/>
  <text x="1365" y="383" text-anchor="middle" class="node-title">Responses API</text>
  <text x="1365" y="409" text-anchor="middle" class="node-sub">structured JSON output</text>
  <text x="1365" y="432" text-anchor="middle" class="node-sub">clean · split · translate</text>
  <rect class="box" x="1235" y="506" width="260" height="82" rx="12" fill="#ffffff" stroke="#e8c98b"/>
  <text x="1365" y="535" text-anchor="middle" class="node-sub">Audio is not persisted.</text>
  <text x="1365" y="558" text-anchor="middle" class="node-sub">No .m4a in DB or Storage.</text>

  <path class="edge" d="M320 377 H365 V235 H430" stroke="#6b8afd" marker-end="url(#arrow-blue)"/>
  <text x="350" y="356" text-anchor="end" class="edge-label" fill="#475467">write</text>
  <path class="edge" d="M770 262 V315" stroke="#32a47b" marker-end="url(#arrow-green)"/>
  <text x="784" y="293" class="edge-label" fill="#28735e">verified request</text>
  <path class="edge" d="M1110 350 H1180 V252 H1235" stroke="#e2a24a" marker-end="url(#arrow-orange)"/>
  <text x="1160" y="276" text-anchor="end" class="edge-label" fill="#9a5d00">audio / transcript</text>
  <path class="edge" d="M1110 450 H1160 V402 H1235" stroke="#e2a24a" marker-end="url(#arrow-orange)"/>
  <text x="1145" y="391" text-anchor="end" class="edge-label" fill="#9a5d00">prompt + schema</text>
  <path class="edge" d="M945 645 V694" stroke="#32a47b" marker-end="url(#arrow-green)"/>
  <text x="962" y="671" class="edge-label" fill="#28735e">service role + user_id</text>
  <path class="edge" d="M320 517 H375 V749 H430" stroke="#6b8afd" marker-end="url(#arrow-blue)"/>
  <text x="390" y="736" class="edge-label" fill="#475467">direct reads</text>
  <path class="edge" d="M705 749 H770" stroke="#32a47b" marker-end="url(#arrow-green)"/>
  <text x="738" y="737" text-anchor="middle" class="edge-label" fill="#28735e">RLS</text>
  <path class="edge" d="M70 229 H55 V693 H70" stroke="#32a47b" marker-end="url(#arrow-green)"/>
  <text x="61" y="615" class="edge-label" fill="#28735e">saveRecordings ON</text>

  </g>
</svg>
